server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(jpg|jpeg|png|webp|svg|mp4|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Liveness/readiness probe for the pod
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
